[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryo-omega-ultra"
version = "0.3.2"
description = "CryoOmega ULTRA — unified CLI, TUI and Web IDE (OmniLink gateway)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pierreg99" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["lib"]
include = ["ultra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib"]


[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["browser-extension", "bundle", "ide"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

name: Python

on:
  push:
    paths:
      - "lib/**"
      - "bin/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "lib/**"
      - "bin/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q
      - name: Doctor (hard contract)
        run: |
          python bin/omega doctor
          test $? -eq 0

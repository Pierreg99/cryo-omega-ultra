<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cryo Omega</title><link rel="stylesheet" href="popup-v2.css"></head>
<body><main class="app"><header><strong>CRYO OMEGA</strong><span>TOPTIER</span></header><section class="hero"><h1>Promoter Suite</h1><p>Promote current page, capture URL, queue download.</p><div class="actions"><button id="promote">Copy Promotion</button><button id="download">Download Page</button><button id="openOptions">Settings</button></div></section><section class="panel"><div class="panel-head"><h2>Download Manager</h2><span id="count" class="badge">0</span></div><div class="stats"><span id="stateSummary">Idle</span><span id="totalSize">0 items</span></div><input id="filter" class="search" type="search" placeholder="Filter downloads" aria-label="Filter downloads"><ul id="queue" class="queue"><li class="empty">No downloads yet.</li></ul></section><p id="status" role="status"></p></main><script src="popup.js"></script></body>
</html>
